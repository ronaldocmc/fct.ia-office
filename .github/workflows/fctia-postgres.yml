name: FCT.IA Office - PostgreSQL
on:
  push:
    branches: [develop/fctia-v0.1]
    paths:
      - 'fctia/persistence/**'
      - 'fctia/brain/**'
      - 'fctia/runtime/**'
      - '.github/workflows/fctia-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: office_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: fctia_office_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U office_test -d fctia_office_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      FCTIA_TEST_DSN: postgresql://office_test:disposable_ci_only@localhost:5432/fctia_office_runtime
      FCTIA_MIGRATION_DATABASE_URL: postgresql+psycopg://office_test:disposable_ci_only@localhost:5432/fctia_office_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r fctia/persistence/requirements.txt
      - name: Provision extension on disposable database
        run: |
          python -c 'import os,psycopg; c=psycopg.connect(os.environ["FCTIA_TEST_DSN"],autocommit=True); c.execute("CREATE EXTENSION vector"); c.close()'
      - name: Apply migrations
        run: |
          alembic -c fctia/persistence/alembic.ini upgrade head
          alembic -c fctia/persistence/alembic.ini current
      - name: Test existing runtime and PostgreSQL
        run: |
          python -m unittest discover -s fctia/tests -v
          python -m unittest discover -s fctia/persistence/tests -v
